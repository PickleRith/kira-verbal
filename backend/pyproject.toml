[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "kira-verbal-backend"
version = "0.1.0"
description = "Kira Verbal assessment API (independent portfolio prototype)"
requires-python = ">=3.11"
# Exact pins: versions validated together on 2026-11-23. Bump deliberately, one at a time.
dependencies = [
  "fastapi==0.165.0",
  "uvicorn[standard]==0.54.0",
  "pydantic==2.14.4",
  "pydantic-settings==2.16.3",
  "sqlalchemy==2.1.9",
  "psycopg[binary]==3.3.9",
  "alembic==1.20.1",
  "redis==8.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.2.0",
  "httpx==0.28.1",
  "ruff==0.17.6",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: needs Postgres and Redis from compose.yaml (skipped unless reachable; REQUIRE_SERVICES=1 makes absence a failure)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency injection idiom; these calls are evaluated once, by design.
extend-immutable-calls = ["fastapi.Depends"]
